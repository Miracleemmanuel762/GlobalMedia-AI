<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalMedia AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="brand">
        <div class="brand-icon">GM</div>
        <div>
            <h1>GlobalMedia AI</h1>
            <span>AI Assistant</span>
        </div>
    </div>

    <button id="newChat">+ New Chat</button>
</header>

<main class="chat-container">
    <div id="messages" class="messages">

        <div class="welcome">
            <div class="welcome-icon">GM</div>
            <h2>Welcome to GlobalMedia AI</h2>
            <p>
                Ask questions, learn new things, generate ideas,
                write content, or simply have a conversation.
            </p>
        </div>

    </div>

    <div class="input-area">
        <div class="input-box">
            <textarea
                id="messageInput"
                placeholder="Message GlobalMedia AI..."
                rows="1"></textarea>

            <button id="sendButton">➤</button>
        </div>

        <p class="disclaimer">
            GlobalMedia AI can make mistakes. Always verify important information.
        </p>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
